<meta charset="utf-8">
<title>CostPilot - architecture</title>
<style>
  :root{
    --ink:#0f172a; --slate:#5b6675; --mut:#94a3b8; --faint:#8b97a8;
    --line2:#d3dae4; --wire:#94a3b8;
    --accent:#f97316; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  }
  html,body{margin:0;}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);padding:26px;
    background-color:#fbfcfe;
    background-image:radial-gradient(#e6ebf2 1px, transparent 1px);
    background-size:26px 26px;
  }
  .frame{max-width:1720px;margin:0 auto;}
  .scroll{overflow-x:auto;}
  svg.arch{width:100%;height:auto;min-width:1400px;display:block;}

  svg.arch text{font-family:"Segoe UI",system-ui,sans-serif;}
  .title{font-size:30px;font-weight:700;fill:var(--ink);}
  .subtitle{font-size:14px;fill:var(--slate);}
  .grp{font-size:11px;font-weight:700;fill:var(--mut);letter-spacing:1.8px;}
  .hh{font-size:20px;font-weight:700;fill:var(--ink);}
  .hs{font-size:12px;fill:var(--slate);}

  .pt{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:1.4px;}
  .sn{font-size:15px;font-weight:700;fill:var(--ink);}
  .sp{font-size:10px;fill:var(--mut);font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .d{font-size:11.5px;fill:var(--slate);}
  .dm{font-size:10.5px;fill:var(--faint);font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .ct{font-size:12.5px;font-weight:700;fill:var(--ink);}
  .li{font-size:11px;fill:var(--slate);}
  .lm{font-size:10.5px;fill:var(--slate);font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .nn{font-size:13px;font-weight:600;fill:var(--ink);}
  .elbl{font-size:10.5px;fill:var(--mut);font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .bnum{font-size:10.5px;font-weight:700;fill:#64748b;}
  .tag{font-size:9.5px;font-weight:700;letter-spacing:.6px;}

  .cont{fill:rgba(255,255,255,.55);stroke:var(--line2);stroke-width:1.4;}
  .pnl{fill:#ffffff;stroke:var(--line2);stroke-width:1.3;}
  .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4;transition:stroke .25s, stroke-width .25s;}
  .chip{fill:#fcfdff;stroke:#e6ebf2;stroke-width:1.2;}
  .lite{fill:#fbfcfe;stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:5 5;}
  .badge{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.2;transition:fill .25s, stroke .25s;}
  .shape{fill:#ffffff;stroke:#dbe2ea;stroke-width:1.5;transition:stroke .25s,stroke-width .25s;}

  .wire{fill:none;stroke:var(--wire);stroke-width:1.5;stroke-linecap:round;}
  .thin{fill:none;stroke:#c3cdd9;stroke-width:1.2;stroke-linecap:round;}
  .async{fill:none;stroke:var(--wire);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:5 7;opacity:.7;}
  .exit{fill:none;stroke:#cbd5e1;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:4 4;}
  @media (prefers-reduced-motion: no-preference){ .async{animation:march 1.9s linear infinite;} }
  @keyframes march{to{stroke-dashoffset:-24;}}

  .stage.active .card{stroke:var(--accent);stroke-width:2.2;filter:url(#glow);}
  .stage.active .badge{fill:var(--accent);stroke:var(--accent);}
  .stage.active .bnum{fill:#fff;}
  .node.pulse .shape,.node.pulse .chip{stroke:var(--accent);stroke-width:2.2;filter:url(#glow);}

  .pk{transform-box:fill-box;transform-origin:center;}
  @media (prefers-reduced-motion: no-preference){ .pk{animation:beat 1.8s ease-in-out infinite;} }
  @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
</style>

      <text x="52" y="454" class="li">identity, never trusted headers (6.1)</text>
      <text x="52" y="476" class="lm">X-Team-ID / X-Project-ID</text>
      <text x="52" y="494" class="li">honoured only for cp_admin_* keys</text>
      <text x="52" y="516" class="lm">X-User-ID · X-Environment</text>
      <text x="52" y="534" class="li">attribution only, no authority</text>
      <text x="52" y="556" class="lm">Idempotency-Key</text>
      <text x="52" y="574" class="li">replay-safe ledger write (2.2)</text>
      <text x="52" y="590" class="lm">X-CostPilot-Min-Tier: 2</text>

      <!-- exits -->
      <rect x="36" y="616" width="264" height="256" rx="14" class="pnl" filter="url(#soft)"/>
      <text x="52" y="638" class="pt">TERMINAL OUTCOMES</text>

      <rect x="52" y="650" width="232" height="46" rx="9" class="chip"/>
      <text x="64" y="668" class="ct" fill="#16a34a">200 OK</text>
      <text x="64" y="686" class="dm">chat.completion · or SSE + [DONE]</text>

      <rect x="52" y="704" width="232" height="46" rx="9" class="chip"/>
      <text x="64" y="722" class="ct" fill="#dc2626">403 policy_denied</text>
      <text x="64" y="740" class="dm">audited before it throws</text>

      <rect x="52" y="758" width="232" height="46" rx="9" class="chip"/>
      <text x="64" y="776" class="ct" fill="#dc2626">402 budget_exceeded</text>
      <text x="64" y="794" class="dm">only when nothing cheaper fits</text>

      <rect x="52" y="812" width="232" height="46" rx="9" class="chip"/>
      <text x="64" y="830" class="ct" fill="#d97706">202 approval.pending</text>
      <text x="64" y="848" class="dm">{ id, state, expires_at }</text>

      <!-- response headers -->
      <rect x="36" y="892" width="264" height="200" rx="14" class="pnl" filter="url(#soft)"/>
      <text x="52" y="914" class="pt">ADMIN / CONTROL PLANE</text>
      <use href="#ic-admin" x="52" y="924" width="18" height="18" style="color:#7c3aed"/>
      <text x="78" y="938" class="li">runtime config, zero redeploy</text>
      <text x="52" y="960" class="lm">/admin/budgets · /admin/policies</text>
      <text x="52" y="978" class="lm">/admin/keys · /admin/approvals</text>
      <text x="52" y="996" class="lm">/admin/audit</text>
      <text x="52" y="1016" class="li">secured by cp_admin_* keys only</text>
      <text x="52" y="1034" class="li">writes invalidate the Redis policy</text>
      <text x="52" y="1050" class="li">and budget caches immediately</text>
      <text x="52" y="1072" class="lm" fill="#7c3aed">AdminAuditService -&gt; admin_audit</text>

      <!-- approval lifecycle -->
      <rect x="36" y="1112" width="264" height="198" rx="14" class="pnl" filter="url(#soft)"/>
      <text x="52" y="1134" class="pt">APPROVAL LIFECYCLE (STAGE 8)</text>
      <use href="#ic-clock" x="52" y="1144" width="18" height="18" style="color:#d97706"/>
      <text x="78" y="1158" class="lm">pending_approval.state</text>
      <text x="52" y="1182" class="li"><tspan class="lm" fill="#d97706">pending</tspan> -&gt; <tspan class="lm" fill="#16a34a">approved</tspan> -&gt; resume once</text>
      <text x="52" y="1200" class="li">replays GovernedRequestExecutor, so</text>
      <text x="52" y="1216" class="li">it runs identical governance, once</text>
      <text x="52" y="1236" class="li"><tspan class="lm" fill="#dc2626">rejected</tspan> · <tspan class="lm" fill="#94a3b8">expired</tspan> by the sweeper</text>
      <text x="52" y="1254" class="li">(@Scheduled, needs no live request)</text>
      <text x="52" y="1276" class="dm">RequestPayloadCodec persists the</text>
      <text x="52" y="1290" class="dm">payload · resume is non-streaming</text>

      <!-- ============================ GATEWAY ============================ -->
      <rect x="320" y="184" width="820" height="1126" rx="18" fill="url(#gwbg)" stroke="var(--line2)" stroke-width="1.4" filter="url(#soft)"/>
      <use href="#ic-coin" x="340" y="200" width="24" height="24"/>
      <text x="372" y="214" class="hh">CostPilot Gateway</text>
      <use href="#ic-spring" x="372" y="223" width="12" height="12"/>
      <text x="389" y="232" class="hs">Spring Boot MVC · virtual threads · WebClient only for upstream SSE · api/ChatCompletionsController orchestrates all of it</text>

      <!-- stage 1 AUTH -->
      <g class="stage" id="st-0">
        <rect class="card" x="346" y="244" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="264" r="11"/><text x="1094" y="268" text-anchor="middle" class="bnum">1</text>
        <use href="#ic-lock" x="366" y="273" width="26" height="26" style="color:#6366f1"/>
        <text x="410" y="272" class="sn">Authenticate</text>
        <text x="410" y="290" class="sp">security/ApiKeyAuthFilter (6.1)</text>
        <text x="410" y="310" class="dm">SecurityConfig · CurrentPrincipal</text>
        <text x="672" y="270" class="d">HMAC-SHA256(key, server pepper) -&gt; api_key.key_hash lookup</text>
        <text x="672" y="288" class="d">yields AuthenticatedPrincipal { tenant, team, project, admin }</text>
        <text x="672" y="306" class="d">team keys are force-pinned to their team; admin keys may</text>
        <text x="672" y="322" class="d">impersonate via X-Team-ID. This is the per-team isolation.</text>
      </g>

      <!-- stage 2 NORMALIZE -->
      <g class="stage" id="st-1">
        <rect class="card" x="346" y="350" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="370" r="11"/><text x="1094" y="374" text-anchor="middle" class="bnum">2</text>
        <use href="#ic-swap" x="366" y="379" width="26" height="26" style="color:#0891b2"/>
        <text x="410" y="378" class="sn">Normalize</text>
        <text x="410" y="396" class="sp">core/model/CanonicalChatRequest</text>
        <text x="410" y="416" class="dm">api/RequestContext · LedgerContext</text>
        <text x="672" y="376" class="d">OpenAI-shaped ChatCompletionRequest -&gt; CanonicalChatRequest.</text>
        <text x="672" y="394" class="d">Everything internal speaks canonical; only the edges speak</text>
        <text x="672" y="412" class="d">provider dialects. LedgerContext carries tenant/team/project/</text>
        <text x="672" y="428" class="d">user/env plus the Idempotency-Key (generated if absent).</text>
      </g>

      <!-- stage 3 POLICY -->
      <g class="stage" id="st-2">
        <rect class="card" x="346" y="456" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="476" r="11"/><text x="1094" y="480" text-anchor="middle" class="bnum">3</text>
        <use href="#ic-policy" x="366" y="485" width="26" height="26" style="color:#d97706"/>
        <text x="410" y="484" class="sn">Policy</text>
        <text x="410" y="502" class="sp">policy/PolicyService (3.3)</text>
        <text x="410" y="522" class="dm">who may spend, on which model</text>
        <text x="672" y="478" class="d"><tspan class="lm" fill="#16a34a">ALLOW</tspan>  ·  <tspan class="lm" fill="#dc2626">DENY</tspan> -&gt; audit then 403  ·  <tspan class="lm" fill="#0891b2">DOWNGRADE</tspan> swaps the</text>
        <text x="672" y="496" class="d">executed model before budget  ·  <tspan class="lm" fill="#d97706">REQUIRE_APPROVAL</tspan> parks it</text>
        <text x="672" y="514" class="d">8.1 cost gate: an otherwise-ALLOW request whose pre-flight MAX</text>
        <text x="672" y="530" class="d">estimate clears approvalThresholdNanos is parked too.</text>
      </g>

      <!-- stage 4 CACHE -->
      <g class="stage" id="st-3">
        <rect class="card" x="346" y="562" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="582" r="11"/><text x="1094" y="586" text-anchor="middle" class="bnum">4</text>
        <use href="#ic-cache" x="366" y="591" width="26" height="26" style="color:#14b8a6"/>
        <text x="410" y="590" class="sn">Semantic cache</text>
        <text x="410" y="608" class="sp">cache/SemanticCacheService (10.2)</text>
        <text x="410" y="628" class="dm">opt-in · COSTPILOT_CACHE_ENABLED</text>
        <text x="672" y="584" class="d">Embedder -&gt; pgvector nearest neighbour scoped to the same</text>
        <text x="672" y="602" class="d">tenant + team: similarity = 1 - (embedding &lt;=&gt; q) ≥ 0.97.</text>
        <text x="672" y="620" class="d">A hit serves the stored response at $0 provider cost, sets</text>
        <text x="672" y="636" class="d">X-CostPilot-Cache: hit, books the would-be cost as savings.</text>
      </g>

      <!-- stage 5 ROUTE -->
      <g class="stage" id="st-4">
        <rect class="card" x="346" y="668" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="688" r="11"/><text x="1094" y="692" text-anchor="middle" class="bnum">5</text>
        <use href="#ic-route" x="366" y="697" width="26" height="26" style="color:#2563eb"/>
        <text x="410" y="696" class="sn">Cost routing</text>
        <text x="410" y="714" class="sp">routing/RoutingService (7.2)</text>
        <text x="410" y="734" class="dm">CostComparisonService · price, never health</text>
        <text x="672" y="690" class="d">Runs only when the client declared X-CostPilot-Min-Tier and</text>
        <text x="672" y="708" class="d">the policy verdict is a plain ALLOW - an explicit DOWNGRADE wins.</text>
        <text x="672" y="726" class="d">Picks the cheapest policy-allowed model at or above the tier and</text>
        <text x="672" y="742" class="d">reports it via X-CostPilot-Model-Routed: original -&gt; executed.</text>
      </g>

      <!-- stage 6 BUDGET -->
      <g class="stage" id="st-5">
        <rect class="card" x="346" y="774" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="794" r="11"/><text x="1094" y="798" text-anchor="middle" class="bnum">6</text>
        <use href="#ic-gauge" x="366" y="803" width="26" height="26" style="color:#16a34a"/>
        <text x="410" y="802" class="sn">Budget reserve</text>
        <text x="410" y="820" class="sp">budget/BudgetGuard.reserve (3.2)</text>
        <text x="410" y="840" class="dm">hot path, target &lt; 5 ms · fail-open</text>
        <text x="672" y="796" class="d">Atomically reserves the request's estimated MAX cost against</text>
        <text x="672" y="814" class="d">every governed scope: <tspan class="lm">TENANT · TEAM · PROJECT · MODEL</tspan>.</text>
        <text x="672" y="832" class="d">Hard block -&gt; DowngradeService retries up to 3 cheaper allowed</text>
        <text x="672" y="848" class="d">models (4.1); only if none fits does the 402 escape. Soft ≤20%</text>
      </g>

      <!-- stage 7 FORWARD -->
      <g class="stage" id="st-6">
        <rect class="card" x="346" y="880" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="900" r="11"/><text x="1094" y="904" text-anchor="middle" class="bnum">7</text>
        <use href="#ic-fwd" x="366" y="909" width="26" height="26" style="color:#4f46e5"/>
        <text x="410" y="908" class="sn">Forward</text>
        <text x="410" y="926" class="sp">upstream/ForwardingService</text>
        <text x="410" y="946" class="dm">provider/ProviderRegistry</text>
        <text x="672" y="902" class="d">Registry resolves the adapter by explicit config first</text>
        <text x="672" y="920" class="d">(costpilot.upstream.model-providers), else model-id prefix.</text>
        <text x="672" y="938" class="d">Non-streaming returns Mono&lt;CanonicalChatResponse&gt;; streaming</text>
        <text x="672" y="954" class="d">returns Flux&lt;CanonicalStreamChunk&gt; relayed via SseEmitter.</text>
      </g>

      <!-- stage 8 METER -->
      <g class="stage" id="st-7">
        <rect class="card" x="346" y="986" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="1006" r="11"/><text x="1094" y="1010" text-anchor="middle" class="bnum">8</text>
        <use href="#ic-cut" x="366" y="1015" width="26" height="26" style="color:#dc2626"/>
        <text x="410" y="1014" class="sn">Meter + cutoff</text>
        <text x="410" y="1032" class="sp">cost/StreamCostMeter (4.2 / 4.3)</text>
        <text x="410" y="1052" class="dm">streaming only</text>
        <text x="672" y="1008" class="d">Accrues cost per SSE chunk. Allowance = this request's own</text>
        <text x="672" y="1026" class="d">reservation + what remained in the tightest governed scope.</text>
        <text x="672" y="1044" class="d">On crossing, takeUntil emits the crossing chunk then cancels</text>
        <text x="672" y="1060" class="d">upstream, appending finish_reason=budget_cutoff + [DONE].</text>
      </g>

      <!-- stage 9 LEDGER -->
      <g class="stage" id="st-8">
        <rect class="card" x="346" y="1092" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="1112" r="11"/><text x="1094" y="1116" text-anchor="middle" class="bnum">9</text>
        <use href="#ic-ledger" x="366" y="1121" width="26" height="26" style="color:#7c3aed"/>
        <text x="410" y="1120" class="sn">Ledger</text>
        <text x="410" y="1138" class="sp">cost/UsageLedgerService (2.2)</text>
        <text x="410" y="1158" class="dm">CostCalculator · PriceVersioningService</text>
        <text x="672" y="1114" class="d">Transactional, idempotent write keyed by Idempotency-Key.</text>
        <text x="672" y="1132" class="d">For streams it runs in doFinally, so tokens are still billed</text>
        <text x="672" y="1150" class="d">when the client disconnects mid-stream. Always charges the</text>
        <text x="672" y="1166" class="d">exact effective-dated price in integer nanodollars (scale 9).</text>
      </g>

      <!-- stage 10 SETTLE -->
      <g class="stage" id="st-9">
        <rect class="card" x="346" y="1198" width="768" height="84" rx="13" filter="url(#card)"/>
        <circle class="badge" cx="1094" cy="1218" r="11"/><text x="1094" y="1222" text-anchor="middle" class="bnum">10</text>
        <use href="#ic-settle" x="366" y="1227" width="26" height="26" style="color:#0d9488"/>
        <text x="410" y="1226" class="sn">Settle</text>
        <text x="410" y="1244" class="sp">release · emit · audit (5.1)</text>
        <text x="410" y="1264" class="dm">AuditService · GovernanceMetrics</text>
        <text x="672" y="1220" class="d">BudgetGuard.release() gives the reservation back - the ledger</text>
        <text x="672" y="1238" class="d">charge is the real deduction, so release is never a refund.</text>
        <text x="672" y="1256" class="d">UsageEventPublisher -&gt; Kafka; the decision (original vs executed</text>
        <text x="672" y="1272" class="d">model, reason, blocked scope) is written to audit_record.</text>
      </g>

      <!-- ============================ RIGHT LANE ============================ -->

      <g class="node" id="dep-apikey">
        <rect class="chip" x="1168" y="248" width="516" height="76" rx="11"/>
      </g>
      <use href="#ic-postgres" x="1184" y="264" width="20" height="20"/>
      <text x="1212" y="270" class="ct">api_key · tenant · team · project</text>
      <text x="1212" y="288" class="li">key_hash (never plaintext), scope flags, revocation</text>
      <text x="1212" y="306" class="dm">pepper is a server secret, not in the DB - a table dump alone is useless</text>

      <rect class="chip" x="1168" y="354" width="516" height="76" rx="11"/>
      <use href="#ic-swap" x="1184" y="370" width="20" height="20" style="color:#0891b2"/>
      <text x="1212" y="376" class="ct">core/model - the internal contract</text>
      <text x="1212" y="394" class="dm">CanonicalChatRequest · CanonicalChatResponse</text>
      <text x="1212" y="412" class="dm">CanonicalStreamChunk · Usage · UsageEvent</text>

      <rect class="chip" x="1168" y="460" width="516" height="76" rx="11"/>
      <use href="#ic-postgres" x="1184" y="476" width="20" height="20"/>
      <text x="1212" y="482" class="ct">policy_rule</text>
      <text x="1212" y="500" class="li">tenant / team scope, model set, action, matched_rule_id</text>
      <text x="1212" y="518" class="dm">approval_threshold_nanos · cached in Redis, invalidated on admin write</text>

      <g class="node" id="dep-cache">
        <rect class="chip" x="1168" y="566" width="516" height="76" rx="11"/>
      </g>
      <use href="#ic-postgres" x="1184" y="582" width="20" height="20"/>
      <text x="1212" y="588" class="ct">prompt_cache  <tspan class="dm">(pgvector)</tspan></text>
      <text x="1212" y="606" class="li">embedding vector, response payload, cost_nanos, tenant + team</text>
      <text x="1212" y="624" class="dm">V13__prompt_cache.sql · MockEmbedder keeps dev deterministic and free</text>

      <rect class="chip" x="1168" y="672" width="516" height="76" rx="11"/>
      <use href="#ic-postgres" x="1184" y="688" width="20" height="20"/>
      <text x="1212" y="694" class="ct">model_price · model_capability</text>
      <text x="1212" y="712" class="li">effective-dated price rows; capability tier bounds the downgrade</text>
      <text x="1212" y="730" class="dm">V4__price_versioning · V9__model_capability · V14__live_model_price</text>

      <g class="node" id="dep-redis">
        <rect class="chip" x="1168" y="778" width="516" height="76" rx="11"/>
      </g>
      <use href="#ic-redis" x="1184" y="794" width="20" height="20"/>
      <text x="1212" y="800" class="ct">Redis counters  <tspan class="dm">rebuildable, never the truth</tspan></text>
      <text x="1212" y="818" class="lm">budget:remaining:{scope}:{ref} · budget:limit:… · budget:none:…</text>
      <text x="1212" y="836" class="dm">plain DECRBY / INCRBY on integer nanos - no INCRBYFLOAT drift</text>

      <!-- upstream block spanning forward + meter -->
      <g class="node" id="dep-upstream">
        <rect class="chip" x="1168" y="884" width="516" height="194" rx="12"/>
      </g>
      <text x="1184" y="904" class="pt">UPSTREAM PROVIDERS</text>
      <use href="#ic-openai" x="1184" y="914" width="20" height="20"/>
      <text x="1212" y="924" class="ct">OpenAI</text>
      <text x="1212" y="940" class="dm">provider/openai/OpenAiAdapter · models without a prefix</text>
      <use href="#ic-anthropic" x="1184" y="952" width="20" height="20"/>
      <text x="1212" y="962" class="ct">Anthropic</text>
      <text x="1212" y="978" class="dm">provider/anthropic/AnthropicAdapter · claude*</text>
      <use href="#ic-gemini" x="1184" y="990" width="20" height="20"/>
      <text x="1212" y="1000" class="ct">Gemini / Vertex</text>
      <text x="1212" y="1016" class="dm">GeminiAdapter + VertexTokenProvider (ADC) · gemini*</text>
      <use href="#ic-mock" x="1184" y="1028" width="20" height="20" style="color:#94a3b8"/>
      <text x="1212" y="1038" class="ct" fill="#64748b">Mock upstream  <tspan class="dm">default, $0 dev</tspan></text>
      <text x="1212" y="1054" class="dm">/mock/openai/v1/chat/completions · /mock/anthropic/v1/messages</text>
      <text x="1212" y="1070" class="dm">/mock/gemini/v1beta/models/{model}:generateContent | :streamGenerateContent</text>

      <g class="node" id="dep-usage">
        <rect class="chip" x="1168" y="1096" width="516" height="76" rx="11"/>
      </g>
      <use href="#ic-postgres" x="1184" y="1112" width="20" height="20"/>
      <text x="1212" y="1118" class="ct">usage_record  <tspan class="dm">the billing source of truth</tspan></text>
      <text x="1212" y="1136" class="li">tokens in/out, cost_nanos, model, decision, savings_nanos</text>
      <text x="1212" y="1154" class="dm">unique on idempotency_key -&gt; a retried request never double-charges</text>

      <rect class="chip" x="1168" y="1202" width="516" height="76" rx="11"/>
      <use href="#ic-key" x="1184" y="1218" width="20" height="20" style="color:#0d9488"/>
      <text x="1212" y="1224" class="ct">audit_record  <tspan class="dm">every decision is queryable</tspan></text>
      <text x="1212" y="1242" class="li">original vs executed model, reason, matched rule, blocked scope</text>
      <text x="1212" y="1260" class="dm">written for rejections too - a 403 or 402 still leaves an explanation</text>

      <!-- response headers strip -->
      <rect x="1168" y="1298" width="516" height="12" rx="6" fill="none"/>

      <!-- ============================ BOTTOM PANELS ============================ -->

      <!-- DATA PLANE -->
      <rect x="36" y="1374" width="600" height="352" rx="16" class="pnl" filter="url(#soft)"/>
      <text x="56" y="1400" class="pt">DATA PLANE  ·  POSTGRES IS TRUTH, REDIS IS A FAST MIRROR</text>

      <g class="node" id="db-postgres">
        <path class="shape" d="M60 1430 L60 1478 A26 7 0 0 0 112 1478 L112 1430"/>
        <ellipse class="shape" cx="86" cy="1430" rx="26" ry="7"/>
      </g>
      <use href="#ic-postgres" x="74" y="1442" width="24" height="24"/>
      <text x="86" y="1502" text-anchor="middle" class="nn">PostgreSQL</text>
      <text x="86" y="1518" text-anchor="middle" class="dm">+ pgvector</text>

      <text x="132" y="1432" class="li">Flyway owns the schema (V1 … V14). Hibernate runs</text>
      <text x="132" y="1450" class="li">ddl-auto=validate, so entities are checked, never authoritative.</text>
      <text x="132" y="1476" class="dm">tenant          team            project         api_key</text>
      <text x="132" y="1492" class="dm">budget          policy_rule     model_price     model_capability</text>
      <text x="132" y="1508" class="dm">usage_record    audit_record    pending_approval admin_audit</text>
      <text x="132" y="1524" class="dm">prompt_cache</text>

      <g class="node" id="db-redis">
        <path class="shape" d="M60 1568 L60 1616 A26 7 0 0 0 112 1616 L112 1568"/>
        <ellipse class="shape" cx="86" cy="1568" rx="26" ry="7"/>
      </g>
      <use href="#ic-redis" x="74" y="1580" width="24" height="24"/>
      <text x="86" y="1640" text-anchor="middle" class="nn">Redis</text>

      <text x="132" y="1570" class="li">Counters are a cache, not a record. Any key can be rebuilt as</text>

      <text x="132" y="1606" class="li">via BudgetService.rebuild, written with SETNX so a concurrent</text>

      <text x="132" y="1648" class="li">Money is integer nanodollars end to end; the hot path may reserve</text>
      <text x="132" y="1664" class="li">at a briefly stale cached rate, but the ledger always charges the</text>
      <text x="132" y="1680" class="li">exact effective-dated price.</text>
      <text x="132" y="1706" class="dm" fill="#d97706">fail-open by design: if Redis is unreachable the request proceeds</text>

      <!-- moving packets -->
      <circle id="pk1" class="pk" r="7.5" fill="url(#pg)" filter="url(#pglow)" opacity="0" cx="300" cy="286"/>
      <circle id="pk2" class="pk" r="5.5" fill="url(#pg)" filter="url(#pglow)" opacity="0" cx="379" cy="286"/>

      <script><![CDATA[
        (function(){
          var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
          function $(id){ return document.getElementById(id); }
          function on(id){ var e=$(id); if(e) e.classList.add('active'); }
          function off(id){ var e=$(id); if(e) e.classList.remove('active'); }
          function pulse(id,ms){ var e=$(id); if(!e) return; e.classList.add('pulse'); setTimeout(function(){ e.classList.remove('pulse'); }, ms||1200); }
          function ease(k){ return k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; }
          function move(el,x0,y0,x1,y1,dur){
            return new Promise(function(res){
              var t0=null;
              function step(t){
                if(t0===null)t0=t;
                var k=Math.min(1,(t-t0)/dur), e=ease(k);
                el.setAttribute('cx', x0+(x1-x0)*e);
                el.setAttribute('cy', y0+(y1-y0)*e);
                if(k<1) requestAnimationFrame(step); else res();
              }
              requestAnimationFrame(step);
            });
          }
          function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

          // stage centres: one column at x=379, pitch 106
          var S=[], ids=[];
          for(var i=0;i<10;i++){ S.push([379, 286 + i*106]); ids.push('st-'+i); }
          var HOP=380, HOLD=340;

          // primary packet: full journey + stage highlight + dependency pulses
          var pk1=$('pk1');
          async function hero(){
            pk1.setAttribute('opacity','1');
            await move(pk1,300,286,S[0][0],S[0][1],460); on(ids[0]); pulse('dep-apikey',1200); await sleep(HOLD);
            for(var i=1;i<S.length;i++){
              await move(pk1,S[i-1][0],S[i-1][1],S[i][0],S[i][1],HOP);
              off(ids[i-1]); on(ids[i]);
              if(i===3) pulse('dep-cache',1200);
              if(i===5) pulse('dep-redis',1300);
              if(i===6) pulse('dep-upstream',1400);
              if(i===8){ pulse('dep-usage',1300); pulse('db-postgres',1300); }
              if(i===9){ pulse('an-kafka',1300);
                setTimeout(function(){pulse('an-ch',1200);},600);
                setTimeout(function(){pulse('ob-prom',1200);},380);
                setTimeout(function(){pulse('ob-graf',1200);},900); }
              await sleep(HOLD);
            }
            await sleep(300);
            off(ids[9]); pk1.setAttribute('opacity','0');
            await sleep(700);
            hero();
          }

          // secondary packet: decorative conveyor, no highlights
          var pk2=$('pk2');
          async function ghost(){
            pk2.setAttribute('opacity','.6');
            for(var i=1;i<S.length;i++){ await move(pk2,S[i-1][0],S[i-1][1],S[i][0],S[i][1],HOP+140); }
            pk2.setAttribute('opacity','0');
            await move(pk2,379,286,379,286,1);
            await sleep(900);
            ghost();
          }

          if(reduce){ on('st-5'); }
          else { hero(); setTimeout(ghost, 2600); }
        })();
      ]]></script>
