<meta charset="utf-8">
<title>CostPilot - architecture</title>
<style>
  :root{
    --ink:#0f172a; --slate:#5b6675; --mut:#94a3b8; --faint:#8b97a8;
    --line2:#d3dae4; --wire:#94a3b8; --accent:#f97316;
  }
  html,body{margin:0;}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);padding:26px;
    background-color:#fbfcfe;
    background-image:radial-gradient(#e6ebf2 1px, transparent 1px);
    background-size:26px 26px;
  }
  .frame{max-width:1460px;margin:0 auto;}
  .scroll{overflow-x:auto;}
  svg.arch{width:100%;height:auto;min-width:1180px;display:block;}

  svg.arch text{font-family:"Segoe UI",system-ui,sans-serif;}
  .title{font-size:29px;font-weight:700;fill:var(--ink);}
  .subtitle{font-size:13.5px;fill:var(--slate);}
  .grp{font-size:10.5px;font-weight:700;fill:var(--mut);letter-spacing:1.7px;}
  .hh{font-size:19px;font-weight:700;fill:var(--ink);}
  .hs{font-size:11.5px;fill:var(--slate);}
  .nn{font-size:12.5px;font-weight:600;fill:var(--ink);}
  .sl{font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle;}
  .tg{font-size:9.5px;fill:var(--faint);text-anchor:middle;font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .mono{font-size:10px;fill:var(--faint);font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .elbl{font-size:9.5px;fill:var(--mut);font-family:"Cascadia Code",ui-monospace,Consolas,monospace;}
  .bnum{font-size:9.5px;font-weight:700;fill:#64748b;}
  .pill{font-size:10px;font-weight:700;text-anchor:middle;}

  .cont{fill:rgba(255,255,255,.55);stroke:var(--line2);stroke-width:1.4;}
  .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4;transition:stroke .22s, stroke-width .22s;}
  .chip{fill:#fcfdff;stroke:#e6ebf2;stroke-width:1.2;transition:stroke .22s, stroke-width .22s;}
  .lite{fill:#fbfcfe;stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:5 5;}
  .badge{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.2;transition:fill .22s, stroke .22s;}
  .shape{fill:#ffffff;stroke:#dbe2ea;stroke-width:1.5;transition:stroke .22s,stroke-width .22s;}
  .ep{stroke-width:1.1;transition:stroke .22s, stroke-width .22s;}

  .wire{fill:none;stroke:var(--wire);stroke-width:1.5;stroke-linecap:round;}
  .thin{fill:none;stroke:#c9d3de;stroke-width:1.2;stroke-linecap:round;}
  .async{fill:none;stroke:var(--wire);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:5 7;opacity:.7;}
  @media (prefers-reduced-motion: no-preference){ .async{animation:march 1.9s linear infinite;} }
  @keyframes march{to{stroke-dashoffset:-24;}}

  .stage.active .card{stroke:var(--accent);stroke-width:2.2;filter:url(#glow);}
  .stage.active .badge{fill:var(--accent);stroke:var(--accent);}
  .stage.active .bnum{fill:#fff;}

  /* anything downstream of the active step lights up with it */
  .node.lit .shape,.node.lit .chip,.node.lit .ep{stroke:var(--accent);stroke-width:2.1;filter:url(#glow);}

  .pk{transform-box:fill-box;transform-origin:center;}
  @media (prefers-reduced-motion: no-preference){ .pk{animation:beat 1.8s ease-in-out infinite;} }
  @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
</style>

      <script><![CDATA[
        (function(){
          var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
          function $(id){ return document.getElementById(id); }
          function ease(k){ return k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; }
          function move(el,x0,y0,x1,y1,dur){
            return new Promise(function(res){
              var t0=null;
              function step(t){
                if(t0===null)t0=t;
                var k=Math.min(1,(t-t0)/dur), e=ease(k);
                el.setAttribute('cx', x0+(x1-x0)*e);
                el.setAttribute('cy', y0+(y1-y0)*e);
                if(k<1) requestAnimationFrame(step); else res();
              }
              requestAnimationFrame(step);
            });
          }
          function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

          // what each step touches - lit together with the step, so the diagram
          // below is always in sync with where the request currently is
          var TOUCHES = [
            ['tb-apikey','db-postgres'],                                  // 1 auth
            [],                                                           // 2 normalize
            ['tb-policy','db-postgres','ex-policy'],                      // 3 policy
            ['tb-cache','db-postgres'],                                   // 4 cache
            ['tb-price','db-postgres'],                                   // 5 route
            ['tb-budget','db-redis','ex-budget'],                         // 6 budget
            [null],                                                       // 7 forward -> provider, filled in below
            ['ex-meter'],                                                 // 8 meter
            ['tb-usage','db-postgres'],                                   // 9 ledger
            ['tb-audit','db-postgres','an-kafka','an-cons','an-ch','an-api',
             'ob-metrics','ob-prom','ob-graf','ex-ok']                    // 10 settle
          ];
          var provs=['pv-openai','pv-anthropic','pv-gemini'];

          var S=[];
          for(var i=0;i<10;i++){ S.push([274 + i*102, 245]); }

          function lit(i,on,loop){
            var st=$('st-'+i); if(st) st.classList.toggle('active',on);
            var list = i===6 ? [provs[loop%3]] : TOUCHES[i];
            list.forEach(function(id){
              if(!id) return;
              var e=$(id); if(e) e.classList.toggle('lit',on);
            });
          }

          var pk1=$('pk1'); var loop=0;
          var HOP=380, HOLD=520;

          async function hero(){
            pk1.setAttribute('opacity','1');
            await move(pk1,186,245,S[0][0],S[0][1],440);
            lit(0,true,loop); await sleep(HOLD);
            for(var i=1;i<S.length;i++){
              lit(i-1,false,loop);
              await move(pk1,S[i-1][0],S[i-1][1],S[i][0],S[i][1],HOP);
              lit(i,true,loop);
              await sleep(HOLD);
            }
            await sleep(400);
            lit(9,false,loop); pk1.setAttribute('opacity','0');
            loop++;
            await sleep(800);
            hero();
          }

          if(reduce){ lit(5,true,0); }
          else { hero(); }
        })();
      ]]></script>
