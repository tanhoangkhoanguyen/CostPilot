version: 2

# Keeps the two supply-chain surfaces that CI actually executes up to date:
# the pinned GitHub Actions and the Gradle dependency graph. Grouped so a
# routine bump is one PR to review, not fifteen.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      # matches the repo's lowercase, no-conventional-prefix commit style
      prefix: bump

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - 'org.springframework*'
          - 'io.spring*'
      testing:
        patterns:
          - 'org.testcontainers*'
          - 'org.junit*'
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: bump

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: bump
