version: 2

# Keeps the two supply-chain surfaces that CI actually executes up to date:
# the pinned GitHub Actions and the Gradle dependency graph. Grouped so a
# routine bump is one PR to review, not fifteen.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      # matches the repo's lowercase, no-conventional-prefix commit style
      prefix: bump

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Two majors are blocked on each other and on a real migration, so proposing them
    # weekly is pure noise. CI proved it rather than assumed it: PR #110 (Boot 4.1.0)
    # failed build + image + vuln-scan, and PR #113 (Gradle 9.6.1) failed image,
    # because the Boot 3.5 plugin is not Gradle 9 compatible. Lift both together when
    # the Boot 4 migration is actually scheduled.
    ignore:
      - dependency-name: org.springframework.boot
        update-types: [version-update:semver-major]
      - dependency-name: gradle
        update-types: [version-update:semver-major]
    groups:
      spring:
        patterns:
          - 'org.springframework*'
          - 'io.spring*'
      testing:
        patterns:
          - 'org.testcontainers*'
          - 'org.junit*'
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: bump

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: bump
