name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gates: docs layout + no AI/Cursor attribution in commit history.
  # Fail here before burning ~3min on Testcontainers.
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base (for commit range)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune origin "${{ github.base_ref }}"

      - name: Forbid Cursor / AI commit attribution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}...HEAD"
            # first push / shallow edge: fall back to last 20 commits
            if ! git rev-parse --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
              RANGE="HEAD~20..HEAD"
            fi
          fi
          echo "Scanning commit range: $RANGE"
          msgs="$(git log --format='%B' "$RANGE" || true)"
          if printf '%s\n' "$msgs" | grep -Eiq \
            '(Co-authored-by:.*([Cc]ursor|[Cc]opilot|[Cc]laude|ChatGPT)|Made[- ]with:\s*[Cc]ursor|Generated by ([Cc]ursor|[Cc]opilot)|cursoragent@|@cursor\.com)'; then
            echo "::error::Commits must not include Cursor/AI co-author trailers or Made-with attribution"
            git log --format='%h %s' "$RANGE" || true
            exit 1
          fi
          echo "OK: no Cursor/AI attribution in commits"

      - name: Docs layout (BENCHMARK under docs/, no ROADMAP)
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/BENCHMARK.md
          test -f docs/README.md
          test ! -e ROADMAP.md
          test ! -e BENCHMARK.md
          test -f loadtest/REPRODUCE.md
          test -f loadtest/guard-benchmark.sh
          test -f src/main/java/com/costpilot/cost/CostCalculator.java
          test -f src/main/java/com/costpilot/cost/CostEstimator.java
          test -f src/main/java/com/costpilot/cost/StreamCostMeter.java
          # README must point at docs/BENCHMARK, not a root ROADMAP
          grep -q 'docs/BENCHMARK.md' README.md
          ! grep -q 'ROADMAP.md' README.md docs/README.md
          echo "OK: docs layout"

  build:
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Pre-pull the images Testcontainers actually uses (pgvector, not plain postgres).
      - name: Pre-pull container images
        run: |
          docker pull pgvector/pgvector:pg16 &
          docker pull redis:7-alpine &
          docker pull apache/kafka:3.8.0 &
          docker pull clickhouse/clickhouse-server:24-alpine &
          wait

      # build = compile + unit/IT + jacoco line/branch gate (check) for gateway + cli
      - name: Build, test, coverage gate
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            cli/build/reports/tests/test
          if-no-files-found: ignore
