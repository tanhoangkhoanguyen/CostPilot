name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that need more raise it themselves.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Fast gates: commit hygiene + repo layout. Fail here before burning ~3min on
  # Testcontainers or ~4min on a container build.
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base (for commit range)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      # Blocks AI/agent attribution in three places, not just the trailer:
      # message body, author identity, committer identity. Renaming the tool of the
      # week is cheap, so match on the vendor domains too.
      - name: Forbid AI/agent commit attribution
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          else
            RANGE="${BEFORE_SHA}...HEAD"
            # first push / shallow edge / force-push: fall back to the last 20 commits
            if ! git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
              RANGE="HEAD~20..HEAD"
            fi
          fi
          echo "Scanning commit range: $RANGE"

          # 1. trailers + "generated with" footers in the message body
          TRAILER_RE='(Co-authored-by:.*([Cc]ursor|[Cc]opilot|[Cc]laude|[Cc]odex|ChatGPT|Gemini|Devin|Windsurf)'
          TRAILER_RE+='|Made[- ]with:[[:space:]]*[Cc]ursor'
          TRAILER_RE+='|Generated (with|by) (\[?[Cc]laude|[Cc]ursor|[Cc]opilot|[Cc]odex)'
          TRAILER_RE+='|🤖 Generated'
          TRAILER_RE+='|noreply@anthropic\.com|cursoragent@|@cursor\.com|@openai\.com)'
          if git log --format='%B' "$RANGE" | grep -Eiq "$TRAILER_RE"; then
            echo "::error::Commit messages must not carry AI/agent attribution trailers or footers"
            git log --format='%h %s' "$RANGE" || true
            exit 1
          fi

          # 2. author and committer identity - a bot trailer removed but a bot author
          #    left behind still puts the wrong name in the history
          IDENT_RE='([Cc]ursor|[Cc]laude|[Cc]opilot|[Cc]odex|[Dd]evin|anthropic\.com|openai\.com|users\.noreply\.cursor)'
          if git log --format='%an <%ae>%n%cn <%ce>' "$RANGE" | grep -Eq "$IDENT_RE"; then
            echo "::error::Commit author/committer identity must not be an AI agent"
            git log --format='%h %an <%ae> / %cn <%ce>' "$RANGE" || true
            exit 1
          fi
          echo "OK: no AI/agent attribution in commit messages or identities"

      # Layout invariants, expressed so an honest refactor does not trip them:
      # docs live under docs/, benchmark scripts are reproducible, and the classes
      # the docs name still exist *somewhere* in the tree (package moves are fine).
      - name: Repo layout
        run: |
          set -euo pipefail
          fail=0
          require_file() {
            if [ ! -f "$1" ]; then echo "::error::missing required file: $1"; fail=1; fi
          }
          forbid_path() {
            if [ -e "$1" ]; then echo "::error::file must not exist at repo root: $1"; fail=1; fi
          }
          require_class() {
            if ! find src/main/java -name "$1.java" -print -quit | grep -q .; then
              echo "::error::missing class $1.java anywhere under src/main/java"; fail=1
            fi
          }

          require_file docs/README.md
          require_file docs/BENCHMARK.md
          require_file loadtest/REPRODUCE.md
          require_file loadtest/guard-benchmark.sh
          require_file loadtest/run.sh
          require_file loadtest/run-savings.sh
          require_file README.md

          # docs belong in docs/, not scattered at the root
          forbid_path ROADMAP.md
          forbid_path BENCHMARK.md

          # build entry points Gradle and Docker actually resolve
          require_file settings.gradle
          require_file build.gradle
          require_file gradle/coverage.gradle
          require_file gradle/versioning.gradle
          require_file .github/workflows/release.yml
          require_file docker/Dockerfile
          forbid_path Dockerfile

          # 3.1: the version must stay tag-derived. A literal reintroduced here is how
          # the artifact, the image tag and the release drift apart again.
          if grep -qE "^\s*version\s*=\s*['\"]" build.gradle cli/build.gradle; then
            echo "::error::hardcoded version literal in a build file - use costpilotVersion"; fail=1
          fi

          # process/scratch notes are local-only, never committed
          if [ -e docs/superpowers ]; then
            echo "::error::docs/superpowers must never be committed"; fail=1
          fi

          require_class CostCalculator
          require_class CostEstimator
          require_class StreamCostMeter

          grep -q 'docs/BENCHMARK.md' README.md || {
            echo "::error::README must link docs/BENCHMARK.md"; fail=1; }
          if grep -q 'ROADMAP.md' README.md docs/README.md; then
            echo "::error::ROADMAP.md must not be linked from README/docs"; fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "OK: repo layout"

      - name: Shellcheck benchmark scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2086 (word splitting) is intentional in a few docker arg expansions
          shellcheck --severity=warning --exclude=SC2086 loadtest/*.sh
          echo "OK: shellcheck clean"

  build:
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # supply chain: refuse to execute a gradle-wrapper.jar that is not a known
      # upstream release. This runs before any ./gradlew invocation.
      - uses: gradle/actions/wrapper-validation@v6.2.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          # only main writes the shared cache; PR runs read it
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pre-pull the images Testcontainers actually uses (pgvector, not plain postgres).
      - name: Pre-pull container images
        run: |
          docker pull pgvector/pgvector:pg16 &
          docker pull redis:7-alpine &
          docker pull apache/kafka:3.8.0 &
          docker pull clickhouse/clickhouse-server:24-alpine &
          wait

      # build = compile + unit/IT + jacoco line/branch gate (check) for gateway + cli
      - name: Build, test, coverage gate
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            cli/build/reports/tests/test
          if-no-files-found: ignore

  # The image is the deliverable for 3.1, so a broken Dockerfile has to fail CI, not
  # the release tag. Build only (no push) and boot it to prove the jar actually runs.
  image:
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: costpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No Postgres/Redis here, so the app is expected to fail its datasource wiring.
      # What we assert is narrower and still meaningful: the entrypoint resolves, the
      # jar is executable, and Spring Boot gets far enough to start booting.
      - name: Smoke test entrypoint
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint java costpilot:ci -version 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'openjdk version "21' || {
            echo "::error::runtime image is not JDK 21"; exit 1; }

          boot="$(timeout 90 docker run --rm costpilot:ci 2>&1 || true)"
          echo "$boot" | tail -40
          echo "$boot" | grep -q 'Starting CostpilotApplication' || {
            echo "::error::image did not reach Spring Boot startup"; exit 1; }
          echo "OK: image boots"

  # Vulnerability scan over the resolved dependency tree - the jars that actually ship,
  # not the version ranges in build.gradle.
  #
  # Not actions/dependency-review-action: that needs the repo-level Dependency graph
  # feature, which is off here and can only be turned on by a repo admin. Trivy needs
  # no repo settings, so this gate actually runs.
  #
  # ignore-unfixed keeps the gate actionable: a CVE with no released fix is not
  # something a PR can resolve, and failing on it would just train people to ignore red.
  vuln-scan:
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v6.2.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      # Trivy reads the jar tree, so give it a real one to read.
      - name: Assemble runtime classpath
        run: ./gradlew bootJar --no-daemon -x test

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: build/libs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
