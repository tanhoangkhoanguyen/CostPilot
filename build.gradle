plugins {
	id 'java'
	id 'jacoco'
	// stay on 3.5.x: the Boot 3.5 plugin is not Gradle 9 compatible and the wrapper is
	// 8.14.3. 3.5.16 is the current patch and is what clears the HIGH/CRITICAL CVEs the
	// vuln-scan job reports against 3.5.3 (spring-security-web CVE-2026-22732 among them).
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.costpilot'
version = '0.0.1-SNAPSHOT'

// boot 3.5.x manages testcontainers 1.21.2, whose bundled docker-java can't talk to
// docker engine 29+ (old API versions removed) - pin a fixed release
ext['testcontainers.version'] = '1.21.3'

// boot 3.5.16 manages pgjdbc 42.7.11, which still carries CVE-2026-54291 (SCRAM-SHA-256-PLUS
// downgrade lets a MITM strip channel binding). Fixed in 42.7.12. Drop this override once
// the managed version catches up.
ext['postgresql.version'] = '42.7.13'

// same story for netty (reactor-netty, via the webflux WebClient): boot manages
// 4.1.135.Final, which is one patch short of the five DoS fixes in 4.1.136.Final
// (CVE-2026-59901 / 55831 / 55833 / 56745 / 56819).
ext['netty.version'] = '4.1.136.Final'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// pin source encoding so non-ASCII test data (Vietnamese/CJK token-estimate cases)
// compiles identically on Windows and Linux CI, not the JVM platform default
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

// Two different lz4 coordinates end up on the classpath and both declare the
// org.lz4:lz4-pure-java capability, so Gradle refuses to pick one on its own:
//   - kafka-clients pulls at.yawk.lz4:lz4-java, the maintained fork Boot 3.5.16 moved to
//   - clickhouse-jdbc still pulls the original org.lz4:lz4-pure-java 1.8.0
// The fork is a drop-in (same net.jpountz.lz4 classes, hence the shared capability) and
// is the one carrying the CVE-2025-12183 fix, so always resolve toward it. ClickHouse
// compression keeps working against it - covered by the ClickHouse Testcontainers tests.
configurations.configureEach {
	resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-pure-java') {
		def fork = candidates.find { it.id.group == 'at.yawk.lz4' }
		if (fork != null) {
			select(fork)
			because 'maintained lz4-java fork, carries the CVE-2025-12183 fix'
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// webflux is only for WebClient (SSE-capable upstream client); MVC stays the server
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 6.2: expose governance + latency metrics at /actuator/prometheus
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 6.1: real API-key auth + per-team isolation on the admin/analytics surfaces
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	// 5.2: append-only usage events off the hot path
	implementation 'org.springframework.kafka:spring-kafka'
	// 5.3: OLAP sink. ClickHouse JDBC is a second, non-primary datasource - Flyway/JPA
	// stay on Postgres. HikariCP comes transitively from spring-data-jpa. NOT the
	// shaded-all classifier: it bundles an old Jackson that shadows Spring's and breaks
	// unrelated JSON code (NoSuchMethodError). Use the thin jar + the apache http client
	// and let Spring's managed Jackson win.
	implementation('com.clickhouse:clickhouse-jdbc:0.7.2') {
		exclude group: 'com.fasterxml.jackson.core'
		exclude group: 'com.fasterxml.jackson.datatype'
	}
	runtimeOnly 'org.apache.httpcomponents.client5:httpclient5'
	// 11.1: Vertex AI auth via ADC - short-lived OAuth2 bearer tokens, no static secret
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.30.1'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:clickhouse'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
	// surface the failing test name in CI logs without dumping every passing case
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
		showExceptions true
		showCauses true
		showStackTraces true
	}
}

// coverage gate (jacoco config, excludes, thresholds, stale-exclude guard)
apply from: "$rootDir/gradle/coverage.gradle"
