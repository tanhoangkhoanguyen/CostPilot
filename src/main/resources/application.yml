spring:
  application:
    name: costpilot
  threads:
    virtual:
      enabled: true
  # Postgres + Redis from docker-compose. No JDBC/Redis clients on the classpath
  # yet (Stage 0.3 adds Flyway/JPA), so these are wiring targets, not live connections.
  datasource:
    url: jdbc:postgresql://${COSTPILOT_DB_HOST:localhost}:${COSTPILOT_DB_PORT:5432}/${COSTPILOT_DB_NAME:costpilot}
    username: ${COSTPILOT_DB_USER:costpilot}
    password: ${COSTPILOT_DB_PASSWORD:costpilot}
    hikari:
      # Virtual threads (above) let the HTTP layer admit effectively unbounded
      # concurrency, so the JDBC pool becomes the real ceiling. At Hikari's default
      # of 10 the pool saturated at ~100 req/s and requests queued behind it: the
      # guard's own timer then measured connection-wait, not the guard, and the
      # e2e tail blew out to ~16s. Sized against Postgres max_connections=100 with
      # room for a second app instance and psql/admin sessions.
      maximum-pool-size: ${COSTPILOT_DB_POOL_MAX:40}
      # kept well below the max on purpose: Hikari defaults minimumIdle to
      # maximumPoolSize, and the test suite caches several Spring contexts that would
      # then each pin 40 connections and blow past Postgres max_connections=100.
      minimum-idle: ${COSTPILOT_DB_POOL_MIN:5}
  data:
    redis:
      host: ${COSTPILOT_REDIS_HOST:localhost}
      port: ${COSTPILOT_REDIS_PORT:6379}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # 5.2: usage-event stream. Off by default so dev/tests without a broker still boot;
  # docker-compose and real deploys set COSTPILOT_KAFKA_ENABLED=true.
  kafka:
    bootstrap-servers: ${COSTPILOT_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080

costpilot:
  # 6.1: server-side pepper for API-key hashing (HMAC-SHA256). The dev default lets
  # tests + the seeded demo keys resolve out of the box; a real deploy MUST override
  # COSTPILOT_API_KEY_PEPPER with a secret. The seeded V8 key hashes are computed with
  # this exact dev value - change it and the seeded keys stop resolving.
  security:
    api-key-pepper: ${COSTPILOT_API_KEY_PEPPER:costpilot-dev-pepper}
  # 5.2: append-only usage events -> Kafka (off the hot path). Disabled by default.
  kafka:
    enabled: ${COSTPILOT_KAFKA_ENABLED:false}
    usage-events-topic: ${COSTPILOT_KAFKA_USAGE_TOPIC:costpilot.usage-events}
    dlq-topic: ${COSTPILOT_KAFKA_DLQ_TOPIC:costpilot.usage-events.dlq}
  # 5.3/5.4: OLAP sink + read side. Second, non-primary datasource - Flyway/JPA stay on
  # Postgres. Disabled by default so dev/tests without ClickHouse still boot.
  clickhouse:
    enabled: ${COSTPILOT_CLICKHOUSE_ENABLED:false}
    jdbc-url: jdbc:ch://${COSTPILOT_CLICKHOUSE_HOST:localhost}:${COSTPILOT_CLICKHOUSE_PORT:8123}/costpilot
    username: ${COSTPILOT_CLICKHOUSE_USER:default}
    password: ${COSTPILOT_CLICKHOUSE_PASSWORD:}
  # Stage 10 / 1.3: semantic cache — opt-in spend reduction. Off by default.
  cache:
    enabled: ${COSTPILOT_CACHE_ENABLED:false}
    similarity-threshold: ${COSTPILOT_CACHE_SIMILARITY_THRESHOLD:0.97}
    # 2.4 (#98): entry lifetime. A hit older than ttl is never served; the eviction
    # sweep deletes past-ttl rows every eviction-interval-ms. ISO-8601 duration.
    ttl: ${COSTPILOT_CACHE_TTL:PT24H}
    eviction-interval-ms: ${COSTPILOT_CACHE_EVICTION_INTERVAL_MS:60000}
  # Embedded mock LLM upstream - default upstream so dev + tests cost $0.
  mock-upstream:
    enabled: true
  upstream:
    # mock -> embedded mock server in this app; real -> provider endpoints below.
    # switching provider endpoints is env/config only - never a code change.
    mode: ${COSTPILOT_UPSTREAM_MODE:mock}
    providers:
      openai:
        base-url: ${COSTPILOT_UPSTREAM_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${COSTPILOT_UPSTREAM_OPENAI_API_KEY:}
      anthropic:
        base-url: ${COSTPILOT_UPSTREAM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-key: ${COSTPILOT_UPSTREAM_ANTHROPIC_API_KEY:}
      gemini:
        base-url: ${COSTPILOT_UPSTREAM_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${COSTPILOT_UPSTREAM_GEMINI_API_KEY:}
        # developer -> Gemini Developer API (x-goog-api-key); vertex -> Vertex AI (ADC
        # bearer). vertex derives its host from location, so base-url is unused there.
        flavor: ${COSTPILOT_UPSTREAM_GEMINI_FLAVOR:developer}
        project: ${COSTPILOT_UPSTREAM_GEMINI_PROJECT:}
        location: ${COSTPILOT_UPSTREAM_GEMINI_LOCATION:}
    # explicit model -> provider overrides; anything unlisted falls back to
    # model-id prefix convention (claude* -> anthropic, gemini* -> gemini, else openai)
    model-providers: {}

management:
  endpoints:
    web:
      exposure:
        # 6.2: prometheus scrape target + health probes; nothing else exposed
        include: health,prometheus,info
  info:
    # 3.1: report the version/commit of the artifact actually running. Reads
    # META-INF/build-info.properties, which the Boot plugin generates from the
    # git-tag-derived version (gradle/versioning.gradle).
    build:
      enabled: true
    # /actuator/info is unauthenticated (SecurityConfig), so it carries version and
    # commit and nothing else. env holds credentials; the exact JDK build is free
    # fingerprinting for an attacker and tells an operator nothing they need.
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
    info:
      access: read_only
    prometheus:
      # Boot 3.4+ gates each endpoint by access level; make the scrape readable
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # every metric carries the app name so a multi-service Prometheus can slice by it
      application: costpilot
